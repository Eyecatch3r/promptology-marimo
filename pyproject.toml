[project]
name = "promptology"
version = "0.1.0"
description = "Code and data for the paper 'Promptology: Large-Scale Systematic Analysis of Prompt Elements and Contextual Factors in Argument Generation' by Maximilian Maurer, Ana Lisboa, Matteo Melis, Julia Romberg, Aldo Costa and Gabriella Lapesa, to appear in EMNLP 2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=0.23.4",
    "bambi>=0.17.2",
    "bert-score>=0.3.13",
    "elfen>=1.3.1",
    "ipywidgets>=8.1.8",
    "langdetect>=1.0.9",
    "mantel>=2.2.3",
    "marimo>=0.24.0",
    "matplotlib>=3.10.8",
    "openai>=2.37.0",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.4.1",
    "statsmodels>=0.14.6",
]
